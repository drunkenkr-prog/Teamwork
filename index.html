<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AI 개발팀 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12151c; --surface:#1a1f2b; --surface2:#202634; --line:#2b3242;
  --text:#dfe4ee; --muted:#8b95a8; --dim:#5c667a;
  --plan:#f2b544; --build:#7aa2f7; --scout:#c67ae6; --danger:#ff6b81;
  --r:14px; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px; line-height:1.6;
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--build);outline-offset:2px;border-radius:6px}

.bar{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.bar-top{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:17px;flex:1;min-width:0}
.brand span{color:var(--dim);font-family:var(--mono);font-size:11px;font-weight:400;display:block;letter-spacing:.08em;text-transform:uppercase}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:17px;flex:0 0 auto;border:1px solid var(--line)}
.icon-btn:active{background:var(--line)}

.modes{display:flex;gap:6px;margin-top:10px;background:var(--bg);padding:4px;border-radius:11px;border:1px solid var(--line)}
.mode{flex:1;padding:8px 4px;border-radius:8px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
.mode.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.mode small{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.06em;margin-top:1px}

.strip{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--muted);font-family:var(--mono);width:100%;text-align:left}
.strip b{color:var(--text);font-weight:600;font-family:Pretendard,sans-serif;font-size:13px;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .caret{color:var(--dim);font-size:10px;margin-left:-4px}
.gauge{flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden;min-width:26px}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--build),var(--scout));border-radius:2px;transition:width .4s}

#feed{flex:1;overflow-y:auto;padding:16px 14px 8px;-webkit-overflow-scrolling:touch}
.empty{text-align:center;color:var(--dim);padding:44px 16px}
.empty h2{color:var(--muted);font-size:16px;margin:0 0 8px}
.empty p{font-size:13px;margin:0 0 18px;line-height:1.7}
.roster{display:flex;flex-direction:column;gap:8px;text-align:left;max-width:340px;margin:0 auto}
.roster div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);border-left:3px solid var(--c)}
.roster b{color:var(--text);display:block;font-size:13px;margin-bottom:1px}

.turn{margin-bottom:22px}
.ask{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);border-top-right-radius:4px;padding:11px 13px;margin:0 0 14px auto;max-width:88%;white-space:pre-wrap;word-break:break-word}

.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.who{font-weight:700;font-size:13.5px;color:var(--c)}
.tag{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.seq{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--c);border:1px solid var(--c);border-radius:20px;padding:1px 7px;opacity:.75}
.copy{margin-left:auto;font-size:11px;color:var(--dim);font-family:var(--mono);padding:4px 6px}
.copy:active{color:var(--text)}
.body{padding:6px 12px 12px;word-break:break-word;overflow-wrap:anywhere}
.body p{margin:.5em 0}
.body h3{font-size:14px;margin:.9em 0 .3em}
.body ul{margin:.4em 0;padding-left:1.1em}
.body code{font-family:var(--mono);font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--plan)}
.body pre{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px;overflow-x:auto;margin:.7em 0}
.body pre code{background:none;padding:0;color:var(--text);font-size:12px;line-height:1.55}
.err{color:var(--danger);font-size:13px;font-family:var(--mono);line-height:1.5}

.dots{display:flex;gap:4px;padding:4px 0 6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes b{0%,60%,100%{opacity:.22}30%{opacity:1}}

.composer{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:9px;align-items:flex-end}
.composer textarea{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;resize:none;max-height:132px;line-height:1.5}
.composer textarea:focus{outline:none;border-color:var(--build)}
.send{width:46px;height:44px;border-radius:12px;flex:0 0 auto;background:var(--build);color:#0d1017;font-weight:700;font-size:18px}
.send:disabled{background:var(--line);color:var(--dim)}

.scrim{position:fixed;inset:0;background:rgba(6,8,12,.66);opacity:0;pointer-events:none;transition:.2s;z-index:9}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;max-height:88dvh;overflow-y:auto;transform:translateY(101%);transition:transform .26s cubic-bezier(.3,.8,.4,1);padding:0 16px calc(env(safe-area-inset-bottom) + 22px)}
.sheet.on{transform:translateY(0)}
.sheet-head{position:sticky;top:0;background:var(--surface);padding:16px 0 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:16px;z-index:2}
.sheet-head h2{margin:0;font-size:16px;flex:1}
.grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:34px;height:4px;background:var(--line);border-radius:2px}

label{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin:0 0 5px}
.field{margin-bottom:14px}
input[type=text],input[type=password],input[type=number],textarea.f{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea.f:focus{outline:none;border-color:var(--build)}
textarea.f{resize:vertical;min-height:72px;line-height:1.5;font-size:13.5px}
.row{display:flex;gap:9px}
.row .field{flex:1}
.member{border-left:3px solid var(--c);padding-left:11px;margin-bottom:20px}
.member h3{margin:0 0 9px;font-size:14px;color:var(--c)}
.hint{font-size:11.5px;color:var(--dim);margin:-8px 0 14px;line-height:1.55}
.btn{width:100%;padding:13px;border-radius:12px;background:var(--build);color:#0d1017;font-weight:700;margin-top:4px}
.btn.warn{background:transparent;color:var(--danger);border:1px solid var(--line);font-weight:600}

/* 프로젝트 목록 */
.proj{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.proj .nm{flex:1;min-width:0}
.proj .nm b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .nm small{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.proj.on .nm b{color:var(--build)}
.proj .dot{width:7px;height:7px;border-radius:50%;background:var(--build);flex:0 0 auto}
.proj .pad{width:7px;flex:0 0 auto}
.proj button{color:var(--dim);font-size:15px;padding:5px 7px;flex:0 0 auto}

.todo{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.todo input[type=checkbox]{width:18px;height:18px;accent-color:var(--build);flex:0 0 auto}
.todo span{flex:1;font-size:13.5px}
.todo span.done{color:var(--dim);text-decoration:line-through}
.todo button{color:var(--dim);font-size:16px;padding:0 4px}
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row input{flex:1}
.add-row button{width:46px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:18px}

.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 78px);left:50%;transform:translateX(-50%) translateY(12px);background:var(--surface2);border:1px solid var(--line);border-radius:22px;padding:9px 17px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:760px){
  #feed,.composer,.bar{max-width:820px;margin-left:auto;margin-right:auto;width:100%}
  .sheet{max-width:560px;left:50%;transform:translate(-50%,101%)}
  .sheet.on{transform:translate(-50%,0)}
}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-top">
    <div class="brand">AI 개발팀 콘솔<span>3-agent dev crew</span></div>
    <button class="icon-btn" id="btnBoard" aria-label="프로젝트 보드">◧</button>
    <button class="icon-btn" id="btnSettings" aria-label="설정">⚙</button>
  </div>
  <div class="modes" role="tablist">
    <button class="mode on" data-mode="parallel" role="tab">병렬 답변<small>3인 동시</small></button>
    <button class="mode" data-mode="debate" role="tab">팀 토론<small>기획→구현→조사→결론</small></button>
  </div>
  <button class="strip" id="strip"></button>
</header>

<main id="feed"></main>

<footer class="composer">
  <textarea id="input" rows="1" placeholder="개발팀에 물어보기…"></textarea>
  <button class="send" id="send" aria-label="보내기">↑</button>
</footer>

<div class="scrim" id="scrim"></div>

<!-- 프로젝트 목록 -->
<section class="sheet" id="sheetProjects" aria-label="프로젝트 목록">
  <div class="grab"></div>
  <div class="sheet-head"><h2>프로젝트</h2><button class="icon-btn close">✕</button></div>
  <div id="projList"></div>
  <div class="add-row">
    <input type="text" id="newProjName" placeholder="새 프로젝트 이름">
    <button id="newProjAdd" aria-label="추가">＋</button>
  </div>
  <p class="hint" style="margin-top:14px">프로젝트마다 대화 기록과 보드가 따로 저장됩니다. API 키와 역할 설정은 모든 프로젝트가 함께 씁니다.</p>
</section>

<!-- 현재 프로젝트 보드 -->
<section class="sheet" id="sheetBoard" aria-label="프로젝트 보드">
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="boardTitle">프로젝트 보드</h2><button class="icon-btn close">✕</button></div>
  <p class="hint">여기 적은 내용은 이 프로젝트의 모든 질문에 배경 정보로 함께 전달됩니다.</p>

  <div class="field"><label>프로젝트 이름</label><input type="text" id="p_name" placeholder="예: 관 파이프 상사"></div>
  <div class="row">
    <div class="field"><label>진행률 %</label><input type="number" id="p_prog" min="0" max="100" value="0"></div>
    <div class="field"><label>엔진 / 스택</label><input type="text" id="p_stack" placeholder="Unity 6 / C#"></div>
  </div>
  <div class="field"><label>지금 하는 일</label><textarea class="f" id="p_now" placeholder="예: 매입·매출 계산 로직 구현 중"></textarea></div>
  <div class="field"><label>다음 목표</label><textarea class="f" id="p_next" placeholder="예: 거래처 AI 흥정 시스템"></textarea></div>

  <label style="margin-top:20px">할 일</label>
  <div id="todos"></div>
  <div class="add-row">
    <input type="text" id="todoInput" placeholder="할 일 추가">
    <button id="todoAdd" aria-label="추가">＋</button>
  </div>

  <button class="btn" id="saveBoard" style="margin-top:22px">저장</button>
  <button class="btn warn" id="clearLog" style="margin-top:10px">이 프로젝트 대화 기록 지우기</button>
</section>

<!-- 설정 -->
<section class="sheet" id="sheetSettings" aria-label="설정">
  <div class="grab"></div>
  <div class="sheet-head"><h2>설정</h2><button class="icon-btn close">✕</button></div>
  <p class="hint">API 키는 이 기기에만 저장되고 서버로 전송되지 않습니다. 모든 프로젝트가 같은 키를 씁니다.</p>

  <div class="member" style="--c:var(--plan)">
    <h3>기획 · ChatGPT</h3>
    <div class="field"><label>OpenAI API 키</label><input type="password" id="k_openai" placeholder="sk-..." autocomplete="off"></div>
    <div class="field"><label>모델</label><input type="text" id="m_openai"></div>
    <div class="field"><label>역할 지시문</label><textarea class="f" id="r_openai"></textarea></div>
  </div>
  <div class="member" style="--c:var(--build)">
    <h3>구현 · Claude</h3>
    <div class="field"><label>Anthropic API 키</label><input type="password" id="k_anthropic" placeholder="sk-ant-..." autocomplete="off"></div>
    <div class="field"><label>모델</label><input type="text" id="m_anthropic"></div>
    <div class="field"><label>역할 지시문</label><textarea class="f" id="r_anthropic"></textarea></div>
  </div>
  <div class="member" style="--c:var(--scout)">
    <h3>조사 · Gemini</h3>
    <div class="field"><label>Google AI Studio 키</label><input type="password" id="k_google" placeholder="AIza..." autocomplete="off"></div>
    <div class="field"><label>모델</label><input type="text" id="m_google"></div>
    <div class="field"><label>역할 지시문</label><textarea class="f" id="r_google"></textarea></div>
  </div>

  <button class="btn" id="saveSettings">저장</button>
</section>

<div class="toast" id="toast"></div>

<script>
/* ══════════ 저장소 ══════════ */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};

const AGENTS = {
  openai   : { name:'기획', sub:'ChatGPT', color:'var(--plan)'  },
  anthropic: { name:'구현', sub:'Claude',  color:'var(--build)' },
  google   : { name:'조사', sub:'Gemini',  color:'var(--scout)' }
};

const DEF_MODELS = { openai:'gpt-4o', anthropic:'claude-sonnet-4-5', google:'gemini-2.0-flash' };
const DEF_ROLES = {
  openai:'너는 1인 게임 개발팀의 디렉터다. 기획, 게임 구조 설계, UI/UX, 우선순위 결정, 전체 총괄을 맡는다. 항상 실행 가능한 결론을 내고, 왜 그 선택인지 한두 줄로 밝혀라. 길게 늘어놓지 말고 핵심만 써라.',
  anthropic:'너는 이 팀의 시니어 엔지니어다. 실제 코드 작성, 리팩토링, 버그 수정, 성능 최적화를 맡는다. 코드는 바로 붙여넣어 돌아가도록 완성형으로 쓰고, 수정 지점을 명확히 표시하라. 위험한 부분은 짧게 경고하라.',
  google:'너는 이 팀의 리서처다. 최신 기술·에셋·플러그인·레퍼런스 조사와 대안 제시를 맡는다. 구체적인 이름과 버전을 밝히고, 항상 대안을 2개 이상 제시하며 각각의 장단점을 한 줄로 비교하라.'
};

const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const blankProject = (name) => ({ id:uid(), name:name||'새 프로젝트', prog:0, stack:'', now:'', next:'', todos:[], log:[] });

/* ══════════ 불러오기 (구버전 자동 이전) ══════════ */
function loadState(){
  let o = null;
  try{ o = JSON.parse(store.get('aiteam.v1') || 'null'); }catch(e){}

  const S = {
    keys:{ openai:'', anthropic:'', google:'' },
    models:{ ...DEF_MODELS },
    roles:{ ...DEF_ROLES },
    mode:'parallel',
    projects:[],
    current:null
  };

  if(o){
    Object.assign(S.keys,   o.keys   || {});
    Object.assign(S.models, o.models || {});
    Object.assign(S.roles,  o.roles  || {});
    S.mode = o.mode || S.mode;

    if(Array.isArray(o.projects) && o.projects.length){
      S.projects = o.projects.map(p => ({ ...blankProject(), ...p }));
      S.current  = o.current;
    }else{
      /* 구버전 데이터 → 프로젝트 1개로 이전 */
      const old = o.project || {};
      const p = blankProject(old.name || '기본 프로젝트');
      p.prog = old.prog || 0; p.stack = old.stack || '';
      p.now = old.now || '';  p.next = old.next || '';
      p.todos = old.todos || []; p.log = o.log || [];
      S.projects = [p]; S.current = p.id;
    }
  }

  if(!S.projects.length){ S.projects = [blankProject('기본 프로젝트')]; }
  if(!S.projects.find(p => p.id === S.current)) S.current = S.projects[0].id;
  return S;
}

let S = loadState();
const save = () => store.set('aiteam.v1', JSON.stringify(S));
const cur  = () => S.projects.find(p => p.id === S.current) || S.projects[0];
save();

/* ══════════ 유틸 ══════════ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function md(t){
  let h = esc(t);
  const blocks = [];
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c) => {
    blocks.push('<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');
    return '\u0000'+(blocks.length-1)+'\u0000';
  });
  h = h.replace(/`([^`\n]+)`/g,'<code>$1</code>')
       .replace(/^#{1,4}\s+(.+)$/gm,'<h3>$1</h3>')
       .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
       .replace(/^[-*]\s+(.+)$/gm,'<li>$1</li>');
  h = h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');
  h = h.split('\n\n').map(p => /^<(h3|ul|pre)/.test(p.trim()) ? p : '<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  return h.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
}

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 1800);
}

/* ══════════ API ══════════ */
async function callOpenAI(sys, usr){
  const r = await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.keys.openai},
    body:JSON.stringify({ model:S.models.openai, messages:[{role:'system',content:sys},{role:'user',content:usr}] })
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error?.message || ('HTTP '+r.status));
  return d.choices[0].message.content;
}
async function callAnthropic(sys, usr){
  const r = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':S.keys.anthropic,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({ model:S.models.anthropic, max_tokens:4096, system:sys, messages:[{role:'user',content:usr}] })
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error?.message || ('HTTP '+r.status));
  return d.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
async function callGemini(sys, usr){
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/'
            + encodeURIComponent(S.models.google) + ':generateContent?key=' + encodeURIComponent(S.keys.google);
  const r = await fetch(url,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ system_instruction:{ parts:[{text:sys}] }, contents:[{ role:'user', parts:[{text:usr}] }] })
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error?.message || ('HTTP '+r.status));
  const c = d.candidates?.[0];
  if(!c) throw new Error('응답이 비어 있습니다. 안전 필터에 걸렸을 수 있습니다.');
  return c.content.parts.map(p=>p.text||'').join('');
}
const CALL = { openai:callOpenAI, anthropic:callAnthropic, google:callGemini };
function ask(agent, sys, usr){
  if(!S.keys[agent]) return Promise.reject(new Error(AGENTS[agent].sub+' 키가 설정에 없습니다.'));
  return CALL[agent](sys, usr);
}

/* ══════════ 프롬프트 ══════════ */
function contextBlock(){
  const p = cur(), L = [];
  if(p.name)  L.push('프로젝트: '+p.name);
  if(p.stack) L.push('스택: '+p.stack);
  if(p.prog)  L.push('진행률: '+p.prog+'%');
  if(p.now)   L.push('지금 하는 일: '+p.now);
  if(p.next)  L.push('다음 목표: '+p.next);
  const open = p.todos.filter(t=>!t.done).map(t=>'- '+t.text);
  if(open.length) L.push('남은 할 일:\n'+open.join('\n'));
  const recent = p.log.filter(e=>e.role==='user').slice(-3).map(e=>'- '+e.text.slice(0,140));
  if(recent.length) L.push('최근 논의:\n'+recent.join('\n'));
  return L.length ? '[프로젝트 현황]\n'+L.join('\n')+'\n\n' : '';
}
function sysFor(agent){
  return S.roles[agent] + '\n\n너는 세 명(기획/구현/조사)으로 이루어진 팀의 한 명이다. 네 담당 영역에 집중하고, 답변은 한국어로, 군더더기 없이 써라.';
}

/* ══════════ 렌더 ══════════ */
const feed = $('#feed');

function renderEmpty(){
  feed.innerHTML = `
  <div class="empty">
    <h2>${esc(cur().name)}</h2>
    <p>세 명이 대기 중입니다.<br>키가 하나만 있어도 그 팀원은 바로 답합니다.</p>
    <div class="roster">
      <div style="--c:var(--plan)"><b>기획 · ChatGPT</b>구조 설계, 우선순위, 전체 총괄</div>
      <div style="--c:var(--build)"><b>구현 · Claude</b>코드 작성, 리팩토링, 버그 수정</div>
      <div style="--c:var(--scout)"><b>조사 · Gemini</b>최신 기술, 에셋, 대안 조사</div>
    </div>
  </div>`;
}

function cardHTML(agent, seq){
  const a = AGENTS[agent];
  return `<div class="card" style="--c:${a.color}">
    <div class="card-head">
      ${seq?`<span class="seq">${seq}</span>`:''}
      <span class="who">${a.name}</span><span class="tag">${a.sub}</span>
      <button class="copy" hidden>복사</button>
    </div>
    <div class="body"><div class="dots"><i></i><i></i><i></i></div></div>
  </div>`;
}
function scrollDown(){ feed.scrollTop = feed.scrollHeight; }

function fillCard(card, text, isError){
  card.querySelector('.body').innerHTML = isError ? '<div class="err">'+esc(text)+'</div>' : md(text);
  if(!isError){
    const btn = card.querySelector('.copy');
    btn.hidden = false;
    btn.onclick = () => navigator.clipboard?.writeText(text)
      .then(()=>toast('복사했습니다'), ()=>toast('복사할 수 없습니다'));
  }
}

function renderLog(){
  const log = cur().log;
  if(!log.length){ renderEmpty(); return; }
  feed.innerHTML = '';
  let turn = null;
  log.forEach(e=>{
    if(e.role==='user'){
      turn = document.createElement('div');
      turn.className = 'turn';
      turn.innerHTML = '<div class="ask">'+esc(e.text)+'</div>';
      feed.appendChild(turn);
    }else{
      if(!turn){ turn = document.createElement('div'); turn.className='turn'; feed.appendChild(turn); }
      const d = document.createElement('div');
      d.innerHTML = cardHTML(e.agent, e.seq);
      const card = d.firstElementChild;
      fillCard(card, e.text, e.error);
      turn.appendChild(card);
    }
  });
  scrollDown();
}

function renderStrip(){
  const p = cur();
  $('#strip').innerHTML =
    `<b>${esc(p.name)}</b><span class="caret">▼</span>` +
    `<span class="gauge"><i style="width:${p.prog}%"></i></span><span>${p.prog}%</span>`;
}

/* ══════════ 전송 ══════════ */
let busy = false;
async function send(){
  const text = $('#input').value.trim();
  if(!text || busy) return;
  if(!S.keys.openai && !S.keys.anthropic && !S.keys.google){
    toast('먼저 설정에서 API 키를 넣어주세요'); openSheet('#sheetSettings'); return;
  }

  const proj = cur();
  busy = true; $('#send').disabled = true;
  $('#input').value = ''; $('#input').style.height = 'auto';

  proj.log.push({ role:'user', text });
  if(feed.querySelector('.empty')) feed.innerHTML = '';
  const turn = document.createElement('div');
  turn.className = 'turn';
  turn.innerHTML = '<div class="ask">'+esc(text)+'</div>';
  feed.appendChild(turn); scrollDown();

  const ctx = contextBlock();
  const active = Object.keys(AGENTS).filter(a => S.keys[a]);

  try{
    if(S.mode === 'parallel'){
      const cards = {};
      active.forEach(a=>{
        const d = document.createElement('div');
        d.innerHTML = cardHTML(a, '');
        cards[a] = d.firstElementChild;
        turn.appendChild(cards[a]);
      });
      scrollDown();
      await Promise.all(active.map(async a=>{
        try{
          const out = await ask(a, sysFor(a), ctx + '[요청]\n' + text);
          fillCard(cards[a], out, false);
          proj.log.push({ role:'ai', agent:a, text:out });
        }catch(err){
          fillCard(cards[a], err.message, true);
          proj.log.push({ role:'ai', agent:a, text:err.message, error:true });
        }
        scrollDown();
      }));
    }else{
      const chain = [
        { a:'openai',    seq:'1',   prompt:()=>ctx+'[요청]\n'+text+'\n\n먼저 방향과 구조를 잡아라. 팀원들이 이어받을 수 있게 요점을 정리해라.' },
        { a:'anthropic', seq:'2',   prompt:t=>ctx+'[요청]\n'+text+'\n\n[기획의 초안]\n'+t.openai+'\n\n이 초안을 기술적으로 검토하고, 실제 코드와 구현 방법을 제시하라. 문제가 있으면 지적하라.' },
        { a:'google',    seq:'3',   prompt:t=>ctx+'[요청]\n'+text+'\n\n[기획]\n'+t.openai+'\n\n[구현]\n'+t.anthropic+'\n\n두 의견을 보고 놓친 최신 기술·에셋·대안을 조사해 제시하라.' },
        { a:'openai',    seq:'결론', prompt:t=>ctx+'[원래 요청]\n'+text+'\n\n[구현 의견]\n'+t.anthropic+'\n\n[조사 의견]\n'+t.google+'\n\n팀 의견을 종합해 최종 결정을 내려라. 무엇을 채택하고 무엇을 버리는지 밝히고, 바로 착수할 다음 단계 3개를 제시하라.' }
      ];
      const got = {};
      for(const step of chain){
        if(!S.keys[step.a]) continue;
        const d = document.createElement('div');
        d.innerHTML = cardHTML(step.a, step.seq);
        const card = d.firstElementChild;
        turn.appendChild(card); scrollDown();
        try{
          const out = await ask(step.a, sysFor(step.a), step.prompt(got));
          got[step.a] = out;
          fillCard(card, out, false);
          proj.log.push({ role:'ai', agent:step.a, seq:step.seq, text:out });
        }catch(err){
          got[step.a] = '(응답 없음)';
          fillCard(card, err.message, true);
          proj.log.push({ role:'ai', agent:step.a, seq:step.seq, text:err.message, error:true });
        }
        scrollDown();
      }
    }
  } finally {
    if(proj.log.length > 60) proj.log = proj.log.slice(-60);
    save();
    busy = false; $('#send').disabled = false;
  }
}

/* ══════════ 시트 ══════════ */
function openSheet(sel){ $('#scrim').classList.add('on'); $(sel).classList.add('on'); }
function closeSheets(){ $('#scrim').classList.remove('on'); $$('.sheet').forEach(s=>s.classList.remove('on')); }
$('#scrim').onclick = closeSheets;
$$('.close').forEach(b => b.onclick = closeSheets);

/* --- 프로젝트 목록 --- */
$('#strip').onclick = ()=>{ renderProjects(); openSheet('#sheetProjects'); };

function switchTo(id){
  S.current = id; save();
  renderStrip(); renderLog(); closeSheets();
  toast(cur().name);
}

function renderProjects(){
  const box = $('#projList');
  box.innerHTML = '';
  S.projects.forEach(p=>{
    const on = p.id === S.current;
    const asks = p.log.filter(e=>e.role==='user').length;
    const row = document.createElement('div');
    row.className = 'proj' + (on ? ' on' : '');
    row.innerHTML = (on ? '<span class="dot"></span>' : '<span class="pad"></span>')
      + '<div class="nm"><b></b><small>' + p.prog + '% · 대화 ' + asks + '건</small></div>'
      + '<button class="ren" aria-label="이름 변경">✎</button>'
      + '<button class="del" aria-label="삭제">✕</button>';
    row.querySelector('b').textContent = p.name;
    row.querySelector('.nm').onclick = ()=> switchTo(p.id);
    row.querySelector('.ren').onclick = ()=>{
      const v = prompt('프로젝트 이름', p.name);
      if(v && v.trim()){ p.name = v.trim(); save(); renderProjects(); renderStrip(); }
    };
    row.querySelector('.del').onclick = ()=>{
      if(S.projects.length === 1){ toast('마지막 프로젝트는 지울 수 없습니다'); return; }
      if(!confirm('"'+p.name+'" 프로젝트와 대화 기록을 모두 지울까요?')) return;
      S.projects = S.projects.filter(x => x.id !== p.id);
      if(S.current === p.id) S.current = S.projects[0].id;
      save(); renderProjects(); renderStrip(); renderLog();
    };
    box.appendChild(row);
  });
}

$('#newProjAdd').onclick = ()=>{
  const v = $('#newProjName').value.trim();
  if(!v){ toast('이름을 입력해주세요'); return; }
  const p = blankProject(v);
  S.projects.push(p); S.current = p.id;
  $('#newProjName').value = '';
  save(); renderProjects(); renderStrip(); renderLog();
  toast(v + ' 시작');
};
$('#newProjName').onkeydown = e => { if(e.key === 'Enter') $('#newProjAdd').click(); };

/* --- 보드 --- */
$('#btnBoard').onclick = ()=>{
  const p = cur();
  $('#boardTitle').textContent = p.name;
  $('#p_name').value = p.name; $('#p_prog').value = p.prog;
  $('#p_stack').value = p.stack; $('#p_now').value = p.now; $('#p_next').value = p.next;
  renderTodos(); openSheet('#sheetBoard');
};

$('#saveBoard').onclick = ()=>{
  const p = cur();
  p.name  = $('#p_name').value.trim() || p.name;
  p.prog  = Math.max(0, Math.min(100, +$('#p_prog').value || 0));
  p.stack = $('#p_stack').value.trim();
  p.now   = $('#p_now').value.trim();
  p.next  = $('#p_next').value.trim();
  save(); renderStrip(); closeSheets(); toast('저장했습니다');
};

$('#clearLog').onclick = ()=>{
  const p = cur();
  if(!confirm('"'+p.name+'"의 대화 기록만 지울까요? 보드 내용은 남습니다.')) return;
  p.log = []; save(); renderLog(); closeSheets(); toast('기록을 지웠습니다');
};

function renderTodos(){
  const box = $('#todos'), p = cur();
  if(!p.todos.length){ box.innerHTML = '<p class="hint" style="margin:6px 0 0">아직 할 일이 없습니다.</p>'; return; }
  box.innerHTML = '';
  p.todos.forEach((t,i)=>{
    const row = document.createElement('div');
    row.className = 'todo';
    row.innerHTML = '<input type="checkbox"' + (t.done?' checked':'') + '>'
      + '<span class="' + (t.done?'done':'') + '"></span><button aria-label="삭제">✕</button>';
    row.querySelector('span').textContent = t.text;
    row.querySelector('input').onchange = e => { p.todos[i].done = e.target.checked; save(); renderTodos(); };
    row.querySelector('button').onclick  = () => { p.todos.splice(i,1); save(); renderTodos(); };
    box.appendChild(row);
  });
}
$('#todoAdd').onclick = ()=>{
  const v = $('#todoInput').value.trim();
  if(!v) return;
  cur().todos.push({ text:v, done:false });
  $('#todoInput').value = ''; save(); renderTodos();
};
$('#todoInput').onkeydown = e => { if(e.key === 'Enter') $('#todoAdd').click(); };

/* --- 설정 --- */
$('#btnSettings').onclick = ()=>{
  ['openai','anthropic','google'].forEach(a=>{
    $('#k_'+a).value = S.keys[a];
    $('#m_'+a).value = S.models[a];
    $('#r_'+a).value = S.roles[a];
  });
  openSheet('#sheetSettings');
};
$('#saveSettings').onclick = ()=>{
  ['openai','anthropic','google'].forEach(a=>{
    S.keys[a]   = $('#k_'+a).value.trim();
    S.models[a] = $('#m_'+a).value.trim() || DEF_MODELS[a];
    S.roles[a]  = $('#r_'+a).value.trim() || DEF_ROLES[a];
  });
  save(); closeSheets(); toast('저장했습니다');
};

/* --- 모드 · 입력 --- */
$$('.mode').forEach(b => b.onclick = ()=>{
  $$('.mode').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); S.mode = b.dataset.mode; save();
});
const ta = $('#input');
ta.addEventListener('input', ()=>{ ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight,132)+'px'; });
ta.addEventListener('keydown', e => { if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); send(); } });
$('#send').onclick = send;

/* --- 시작 --- */
$$('.mode').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
renderStrip();
renderLog();
</script>
</body>
</html>
